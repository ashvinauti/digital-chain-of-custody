{% extends "base.html" %}
{% block content %}
<h1>Change password</h1>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="current_password">Current password</label><input type="password" id="current_password" name="current_password" required>
  <label for="new_password">New password (12+ characters)</label><input type="password" id="new_password" name="new_password" minlength="12" required>
  <label for="confirm_password">Confirm new password</label><input type="password" id="confirm_password" name="confirm_password" minlength="12" required>
  <p><button>Change password</button></p>
</form>
{% endblock %}
