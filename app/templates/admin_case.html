{% extends "base.html" %}
{% block content %}
<h1>Case {{ case.number }}: {{ case.title }}</h1>
<h2>Members</h2>
<table>
  <tr><th>User</th><th>Role</th><th></th></tr>
  {% for m in case.members %}
  <tr><td>{{ m.username }}</td><td>{{ m.role }}</td><td>
    <form class="inline" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="op" value="remove"><input type="hidden" name="user_id" value="{{ m.id }}">
      <button>Remove</button>
    </form></td></tr>
  {% else %}
  <tr><td colspan="3">No members yet.</td></tr>
  {% endfor %}
</table>
{% if candidates %}
<h2>Add member</h2>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="op" value="add">
  <select name="user_id">{% for u in candidates %}<option value="{{ u.id }}">{{ u.username }} ({{ u.role }})</option>{% endfor %}</select>
  <button>Add</button>
</form>
{% endif %}
<p><a href="{{ url_for('main.admin_cases') }}">All cases</a></p>
{% endblock %}
